{%- comment -%}
Venn diagram of research areas (inline SVG, no JavaScript, no image file).
Edit the <text> labels below to change the wording.
{%- endcomment -%}
<figure class="venn">
<svg viewBox="0 0 300 286" role="img" aria-labelledby="venn-title venn-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="venn-title">Research areas</title>
  <desc id="venn-desc">A Venn diagram of three areas that meet at a small central region: Compilers, Formal Verification, and Agentic AI. A dot marks the small region where all three overlap.</desc>

  <circle cx="100" cy="100" r="80" fill="#4c9be8" fill-opacity="0.30" stroke="#4c9be8" stroke-width="1.5"/>
  <circle cx="200" cy="100" r="80" fill="#e8a14c" fill-opacity="0.30" stroke="#e8a14c" stroke-width="1.5"/>
  <circle cx="150" cy="187" r="80" fill="#6cc070" fill-opacity="0.30" stroke="#6cc070" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#333" text-anchor="middle">
    <g font-size="15" font-weight="700">
      <text x="67" y="86">Compilers</text>
      <text x="233" y="78">Formal</text><text x="233" y="95">Verification</text>
      <text x="150" y="222">Agentic</text><text x="150" y="239">AI</text>
    </g>
    <!-- center dot: where all three areas meet -->
    <circle cx="150" cy="129" r="4.5" fill="#333"/>
  </g>
</svg>
</figure>
