<style>
  /* Visually hide the page title on the four main tabs (kept for screen readers) */
  body[class*="tab-"] .page__title {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  /* Bold the nav link for the current tab */
  .tab-home     .masthead__menu-item a[href="/"],
  .tab-research .masthead__menu-item a[href$="/research.html"],
  .tab-teaching .masthead__menu-item a[href$="/teaching.html"],
  .tab-personal .masthead__menu-item a[href$="/personal.html"] {
    font-weight: 700;
    border-bottom: 2px solid currentColor;
  }
  /* Bigger profile photo: fill the sidebar on wide screens, 160px otherwise */
  @media (min-width: 1024px) { .author__avatar img { max-width: 100%; } }
  @media (max-width: 1023px) {
    .author__avatar { display: block; width: auto; height: auto; }
    .author__avatar img { max-width: 160px; }
  }
  /* No grey-then-brighten hover effect on the sidebar/photo */
  .sidebar { opacity: 1; transition: none; }
  /* Thin border directly against the photo edge (no padding gap) */
  .author__avatar img { padding: 0; }
  /* About me: paragraph with the Venn diagram beside it on wide screens, below it on narrow ones */
  .about { display: flex; gap: 1.5em; align-items: flex-start; margin-bottom: 1em; }
  .about__text { flex: 1 1 auto; min-width: 0; }
  figure.venn { flex: 0 0 250px; width: 250px; margin: 0.4em 0 0; }
  figure.venn svg { display: block; width: 100%; height: auto; }
  @media (max-width: 767px) {
    .about { flex-direction: column; }
    figure.venn { align-self: center; flex: 0 0 auto; width: 100%; max-width: 280px; }
  }
  /* No hover "permalink" chain icon next to headings */
  .page__content .header-link { display: none; }
</style>
